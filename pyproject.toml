[project]
name = "substack-brain-course"
version = "0.1.0"
description = "A living knowledge base built from technical newsletters — companion code for the harness-engineering course."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.7.0",
    "asyncpg==0.31.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "inngest==0.5.19",
    "openai==3.16.2",
    "pgvector==0.5.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.54",
    "trafilatura==2.2.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic owns the format of generated revision scripts; don't fight its template.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["kb/schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
