<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="100%" height="100%">
  <defs>
    <style>
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #2C3560;
      }
      .node-heading {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 14.5px;
        fill: #2C3560;
      }
      .prop-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #2C3560;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #52587A;
      }
      .badge-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 11.5px;
        fill: #2C3560;
      }
    </style>
  </defs>

  <!-- White Canvas Background -->
  <rect width="1280" height="560" rx="18" fill="#FFFFFF" />

  <!-- Top Header Banner -->
  <rect x="32" y="22" width="1216" height="64" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />

  <!-- Grid / Taxonomy Icon in Header -->
  <g transform="translate(54, 38)" fill="none" stroke="#2C3560" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="11" height="11" rx="2.5" fill="#FFFFFF" />
    <rect x="17" y="2" width="11" height="11" rx="2.5" fill="#FFFFFF" />
    <rect x="2" y="17" width="11" height="11" rx="2.5" fill="#FFFFFF" />
    <rect x="17" y="17" width="11" height="11" rx="2.5" fill="#FFFFFF" />
  </g>
  <text x="98" y="61" class="title-text">Axial Failure Taxonomy (evals/taxonomy.yaml)</text>

  <!-- Header Summary Pills -->
  <rect x="598" y="38" width="214" height="32" rx="8" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />
  <text x="705" y="59" text-anchor="middle" class="badge-text">L1: Deterministic Python</text>

  <rect x="826" y="38" width="204" height="32" rx="8" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
  <text x="928" y="59" text-anchor="middle" class="badge-text">L2: Binary LLM Judges</text>

  <rect x="1044" y="38" width="182" height="32" rx="8" fill="#FEE8B4" stroke="#EEC15E" stroke-width="2" />
  <text x="1135" y="59" text-anchor="middle" class="badge-text">Retrieval Metrics</text>


  <!-- ===================================================================== -->
  <!-- ROW 1: LEVEL 1 DETERMINISTIC CODE CHECKS (FM-1, FM-2, FM-3)           -->
  <!-- ===================================================================== -->

  <!-- FM-1 Card (Sky Blue Palette) -->
  <g transform="translate(32, 110)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#59ADD9" stroke-width="2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-1</text>
    <text x="80" y="40" class="node-heading">phantom_or_dangling_citation</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">Inline [k] marker is out of bounds (1..N), missing from</text>
    <text x="28" y="110" class="sub-text">citations, or passage_id is absent from retrieved.</text>
    <text x="28" y="129" class="prop-text">Check: citation_bounds_valid &amp; subset</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Synthesis</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">L1: Deterministic Python</text>
  </g>

  <!-- FM-2 Card (Sky Blue Palette) -->
  <g transform="translate(446, 110)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#59ADD9" stroke-width="2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-2</text>
    <text x="80" y="40" class="node-heading">stale_revision_cited</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">A cited passage_id or claim_id has valid_to != NULL</text>
    <text x="28" y="110" class="sub-text">(superseded by an article edit in Weeks 3–4).</text>
    <text x="28" y="129" class="prop-text">Check: no_superseded_sources_cited</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Temporal</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">L1: Deterministic Python</text>
  </g>

  <!-- FM-3 Card (Soft Purple Palette — Hybrid Code + Judge) -->
  <g transform="translate(860, 110)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-3</text>
    <text x="80" y="40" class="node-heading">ungrounded_speculation</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">Retriever returned 0 passages (or thin context), yet</text>
    <text x="28" y="110" class="sub-text">the synthesizer answered from pre-training memory.</text>
    <text x="28" y="129" class="prop-text">Check: abstain_or_cite_discipline</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Synthesis</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">L1 Code + L2 Binary Judge</text>
  </g>


  <!-- ===================================================================== -->
  <!-- ROW 2: BINARY LLM JUDGES & RETRIEVAL BENCHMARK (FM-4, FM-5, FM-6)     -->
  <!-- ===================================================================== -->

  <!-- FM-4 Card (Mint Green Palette — Faithfulness Judge) -->
  <g transform="translate(32, 334)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#43C37E" stroke-width="2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-4</text>
    <text x="80" y="40" class="node-heading">unfaithful_or_inflation</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">Answer contradicts cited passage [k] or inflates an</text>
    <text x="28" y="110" class="sub-text">author's opinion / prediction into a measurement.</text>
    <text x="28" y="129" class="prop-text">Judge: faithfulness_judge_agent</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Synthesis</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">L2: Binary PASS/FAIL Judge</text>
  </g>

  <!-- FM-5 Card (Soft Rose Palette — Disagreement Judge) -->
  <g transform="translate(446, 334)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#D9468F" stroke-width="2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-5</text>
    <text x="80" y="40" class="node-heading">missed_disagreement</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#D9468F" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">Retrieved context has conflicting claims from &gt;= 2</text>
    <text x="28" y="110" class="sub-text">authors/publications, but answer suppresses one side.</text>
    <text x="28" y="129" class="prop-text">Judge: disagreement_judge_agent</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#D9468F" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Synthesis</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">L2: Binary PASS/FAIL Judge</text>
  </g>

  <!-- FM-6 Card (Slate + Warm Amber Palette — Retrieval Benchmark) -->
  <g transform="translate(860, 334)">
    <rect x="0" y="0" width="388" height="202" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />

    <!-- Header Pill -->
    <rect x="16" y="14" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#EEC15E" stroke-width="2.2" />
    <rect x="24" y="23" width="46" height="24" rx="6" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="47" y="39" text-anchor="middle" class="badge-text">FM-6</text>
    <text x="80" y="40" class="node-heading">retrieval_miss</text>

    <!-- Description Box -->
    <rect x="16" y="68" width="356" height="72" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.8" />
    <text x="28" y="91" class="sub-text">Gold passage or claim exists in Postgres/Memgraph</text>
    <text x="28" y="110" class="sub-text">but missed the top-k snapshots.retrieved list.</text>
    <text x="28" y="129" class="prop-text">Metric: Recall@5 · MRR · Cross-Pub</text>

    <!-- Bottom Tier Badges -->
    <rect x="16" y="152" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.6" />
    <text x="84" y="174" text-anchor="middle" class="prop-text">Layer: Retrieval</text>

    <rect x="164" y="152" width="208" height="34" rx="8" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.6" />
    <text x="268" y="174" text-anchor="middle" class="badge-text">4-Way Variant Benchmark</text>
  </g>

</svg>

