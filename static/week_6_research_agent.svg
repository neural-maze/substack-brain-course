<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="100%" height="100%">
  <defs>
    <style>
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #2C3560;
      }
      .node-heading {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 14.5px;
        fill: #2C3560;
      }
      .prop-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 600;
        font-size: 11.5px;
        fill: #2C3560;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        fill: #52587A;
      }
      .badge-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 11px;
        fill: #2C3560;
      }
      .edge-label {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 11.5px;
        fill: #2C3560;
      }
    </style>

    <!-- Arrowhead Markers -->
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2C3560" />
    </marker>
    <marker id="arrow-dotted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4A3F28" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2B8A57" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="580" rx="18" fill="#FFFFFF" />

  <!-- ========================================== -->
  <!-- TOP HEADER BANNER                          -->
  <!-- ========================================== -->
  <g id="header">
    <rect x="24" y="18" width="1232" height="58" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <text x="52" y="54" class="title-text">Bounded Research Agent (kb/functions/research.py)</text>

    <!-- Header Summary Badges -->
    <rect x="650" y="31" width="175" height="32" rx="10" fill="#DFF4FF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="737" y="51" text-anchor="middle" class="badge-text">Asymmetry: &lt;50ms Queue</text>

    <rect x="838" y="31" width="218" height="32" rx="10" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="947" y="51" text-anchor="middle" class="badge-text">Hops &lt;= 3 · Cost &lt;= $0.25</text>

    <rect x="1069" y="31" width="166" height="32" rx="10" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="1152" y="51" text-anchor="middle" class="badge-text">Week 5 Self-Eval Gate</text>
  </g>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: FAST DISPATCH (<50ms)         -->
  <!-- ========================================== -->
  <g id="left-trigger">
    <rect x="24" y="102" width="248" height="210" rx="16" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />
    <text x="148" y="130" text-anchor="middle" class="node-heading">Fast Dispatch (&lt;50ms)</text>
    <text x="148" y="150" text-anchor="middle" class="sub-text">Non-blocking HTTP &amp; MCP entry</text>

    <!-- HTTP Endpoint -->
    <rect x="40" y="166" width="216" height="34" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="148" y="187" text-anchor="middle" class="prop-text">POST /research</text>

    <!-- MCP Tool -->
    <rect x="40" y="208" width="216" height="34" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="148" y="229" text-anchor="middle" class="prop-text">MCP: kb_research(question)</text>

    <!-- Immediate Receipt -->
    <rect x="40" y="252" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="148" y="271" text-anchor="middle" class="prop-text">research_id = "res_..."</text>
    <text x="148" y="287" text-anchor="middle" class="sub-text">returns {research_id, trace_url}</text>
  </g>

  <!-- Left Guardrails Summary Box -->
  <g id="left-guardrails">
    <rect x="24" y="338" width="248" height="218" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <text x="148" y="366" text-anchor="middle" class="node-heading">Hard Loop Guardrails</text>
    <text x="148" y="386" text-anchor="middle" class="sub-text">Enforced between Inngest steps</text>

    <rect x="40" y="402" width="216" height="30" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="148" y="421" text-anchor="middle" class="prop-text">max_iterations = 3 hops</text>

    <rect x="40" y="440" width="216" height="30" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="148" y="459" text-anchor="middle" class="prop-text">max_usd = $0.25 ceiling</text>

    <rect x="40" y="478" width="216" height="30" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="148" y="497" text-anchor="middle" class="prop-text">newly_added == 0 (no gain)</text>

    <rect x="40" y="516" width="216" height="26" rx="8" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="148" y="533" text-anchor="middle" class="badge-text">concurrency_research_runs = 2</text>
  </g>

  <!-- ========================================== -->
  <!-- CENTER CONTAINER: run-research-agent       -->
  <!-- ========================================== -->
  <g id="center-inngest">
    <!-- Outer Durable Function Container -->
    <rect x="334" y="102" width="608" height="454" rx="18" fill="#F6FBF8" stroke="#43C37E" stroke-width="2.5" />
    <rect x="352" y="116" width="572" height="38" rx="10" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="638" y="140" text-anchor="middle" class="node-heading">run-research-agent (Inngest Durable Function · retries=1)</text>

    <!-- ROW 1: Step 1 & Step 2 -->
    <rect x="352" y="168" width="268" height="58" rx="12" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
    <text x="486" y="192" text-anchor="middle" class="prop-text">1. record-research-start</text>
    <text x="486" y="211" text-anchor="middle" class="sub-text">upsert status="running" in Postgres</text>

    <rect x="652" y="168" width="272" height="58" rx="12" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
    <text x="788" y="192" text-anchor="middle" class="prop-text">2. plan-subqueries</text>
    <text x="788" y="211" text-anchor="middle" class="sub-text">QueryPlannerAgent (1..3 subqueries)</text>

    <!-- ROW 2: Bounded Multi-Hop Box (Steps 3, 4, 5) -->
    <rect x="352" y="244" width="572" height="148" rx="14" fill="#FFFDF5" stroke="#EEC15E" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="368" y="254" width="540" height="24" rx="6" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.2" />
    <text x="638" y="270" text-anchor="middle" class="badge-text">Bounded Retrieval-Reflection Loop (Steps 3, 4 &amp; 5)</text>

    <!-- Step 3: hop-1-retrieve -->
    <rect x="368" y="288" width="168" height="88" rx="10" fill="#D8F8E4" stroke="#43C37E" stroke-width="1.8" />
    <text x="452" y="311" text-anchor="middle" class="prop-text">3. hop-1-retrieve</text>
    <text x="452" y="330" text-anchor="middle" class="sub-text">3-way RRF search</text>
    <rect x="380" y="341" width="144" height="24" rx="6" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.2" />
    <text x="452" y="357" text-anchor="middle" class="badge-text">+ deduplication</text>

    <!-- Step 4: hop-1-reflect -->
    <rect x="554" y="288" width="168" height="88" rx="10" fill="#D8F8E4" stroke="#43C37E" stroke-width="1.8" />
    <text x="638" y="311" text-anchor="middle" class="prop-text">4. hop-1-reflect</text>
    <text x="638" y="330" text-anchor="middle" class="sub-text">CoverageCriticAgent</text>
    <rect x="566" y="341" width="144" height="24" rx="6" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.2" />
    <text x="638" y="357" text-anchor="middle" class="badge-text">sufficient? gaps?</text>

    <!-- Step 5: hop-2-retrieve / hop-2-reflect -->
    <rect x="740" y="288" width="168" height="88" rx="10" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.8" />
    <text x="824" y="309" text-anchor="middle" class="prop-text">5. hop-2..N</text>
    <text x="824" y="325" text-anchor="middle" class="prop-text">retrieve / reflect</text>
    <rect x="750" y="336" width="148" height="30" rx="6" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.2" />
    <text x="824" y="350" text-anchor="middle" class="sub-text">bounded by max_usd</text>
    <text x="824" y="362" text-anchor="middle" class="sub-text">&amp; max_iterations</text>

    <!-- ROW 3: Step 6 & Step 7 -->
    <rect x="352" y="410" width="268" height="58" rx="12" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
    <text x="486" y="434" text-anchor="middle" class="prop-text">6. synthesize-report</text>
    <text x="486" y="453" text-anchor="middle" class="sub-text">ResearchSynthesizerAgent ([k] citations)</text>

    <rect x="652" y="410" width="272" height="58" rx="12" fill="#FEE8B4" stroke="#EEC15E" stroke-width="2" />
    <text x="788" y="434" text-anchor="middle" class="prop-text">7. evaluate-report</text>
    <text x="788" y="453" text-anchor="middle" class="sub-text">Week 5 deterministic + binary judges</text>

    <!-- ROW 4: Step 8 & Step 9 -->
    <rect x="352" y="484" width="268" height="56" rx="12" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />
    <text x="486" y="508" text-anchor="middle" class="prop-text">8. persist-research-run</text>
    <text x="486" y="527" text-anchor="middle" class="sub-text">writes research_runs row</text>

    <rect x="652" y="484" width="272" height="56" rx="12" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />
    <text x="788" y="508" text-anchor="middle" class="prop-text">9. emit-research-completed</text>
    <text x="788" y="527" text-anchor="middle" class="sub-text">emits kb/research.completed</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: PERSISTENCE & FAST READ      -->
  <!-- ========================================== -->
  <g id="right-outputs">
    <!-- Postgres research_runs Card -->
    <rect x="1004" y="102" width="252" height="248" rx="16" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />
    <text x="1130" y="130" text-anchor="middle" class="node-heading">Postgres Persistence</text>
    <text x="1130" y="150" text-anchor="middle" class="sub-text">Full audit trail in research_runs</text>

    <rect x="1020" y="164" width="220" height="30" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1130" y="183" text-anchor="middle" class="prop-text">plan + hops[] JSONB</text>

    <rect x="1020" y="202" width="220" height="30" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1130" y="221" text-anchor="middle" class="prop-text">report + citations [1..k]</text>

    <rect x="1020" y="240" width="220" height="30" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1130" y="259" text-anchor="middle" class="prop-text">eval_summary (FM-1..FM-5)</text>

    <rect x="1020" y="278" width="220" height="54" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1130" y="299" text-anchor="middle" class="prop-text">confidence: high | medium | low</text>
    <text x="1130" y="317" text-anchor="middle" class="sub-text">stopped_reason + total_cost_usd</text>

    <!-- Fast Read & Event Output Card -->
    <rect x="1004" y="372" width="252" height="184" rx="16" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />
    <text x="1130" y="400" text-anchor="middle" class="node-heading">Fast Result &amp; Event</text>
    <text x="1130" y="420" text-anchor="middle" class="sub-text">Instant lookup &amp; downstream hook</text>

    <rect x="1020" y="434" width="220" height="32" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="1130" y="454" text-anchor="middle" class="prop-text">GET /research/{id} (&lt;1s)</text>

    <rect x="1020" y="474" width="220" height="32" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="1130" y="494" text-anchor="middle" class="prop-text">MCP: kb_research_result</text>

    <rect x="1020" y="514" width="220" height="28" rx="8" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="1130" y="532" text-anchor="middle" class="badge-text">kb/research.completed</text>
  </g>

  <!-- ========================================== -->
  <!-- CONNECTORS & ARROWS                        -->
  <!-- ========================================== -->
  <g id="connectors">
    <!-- Trigger -> Inngest Function (kb/research.requested) -->
    <path d="M 272 197 L 330 197" fill="none" stroke="#4A3F28" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-dotted)" />
    <rect x="250" y="106" width="166" height="24" rx="6" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="333" y="122" text-anchor="middle" class="badge-text">kb/research.requested</text>
    <path d="M 303 130 L 303 192" fill="none" stroke="#EEC15E" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Step 1 -> Step 2 -->
    <path d="M 620 197 L 646 197" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 2 -> Step 3 -->
    <path d="M 788 226 L 788 236 L 452 236 L 452 282" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 3 -> Step 4 -->
    <path d="M 536 332 L 548 332" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 4 -> Step 5 -->
    <path d="M 722 332 L 734 332" fill="none" stroke="#4A3F28" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dotted)" />

    <!-- Step 5 -> Step 6 (exit loop to synthesize) -->
    <path d="M 638 392 L 638 401 L 486 401 L 486 406" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 6 -> Step 7 -->
    <path d="M 620 439 L 646 439" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 7 -> Step 8 -->
    <path d="M 788 468 L 788 476 L 486 476 L 486 480" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 8 -> Step 9 -->
    <path d="M 620 512 L 646 512" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 8 -> Postgres Card -->
    <path d="M 942 255 L 998 255" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Step 9 -> Fast Result & Event Card -->
    <path d="M 924 512 L 998 512" fill="none" stroke="#4A3F28" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-dotted)" />
  </g>
</svg>

