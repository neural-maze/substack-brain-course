<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="100%" height="100%">
  <defs>
    <style>
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #2C3560;
      }
      .node-heading {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 14.5px;
        fill: #2C3560;
      }
      .prop-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 600;
        font-size: 11.5px;
        fill: #2C3560;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        fill: #52587A;
      }
      .badge-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 11px;
        fill: #2C3560;
      }
    </style>

    <marker id="arrow-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2C3560" />
    </marker>
    <marker id="arrow-dotted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4A3F28" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="560" rx="18" fill="#FFFFFF" />

  <!-- ========================================== -->
  <!-- TOP HEADER BANNER                          -->
  <!-- ========================================== -->
  <g id="header">
    <rect x="24" y="18" width="1232" height="58" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <text x="52" y="54" class="title-text">Three Agent Roles &amp; Three Hard Guardrails</text>

    <rect x="700" y="31" width="180" height="32" rx="10" fill="#DFF4FF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="790" y="51" text-anchor="middle" class="badge-text">Zero Frameworks (~180 LoC)</text>

    <rect x="892" y="31" width="176" height="32" rx="10" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="980" y="51" text-anchor="middle" class="badge-text">Dedup by passage_id</text>

    <rect x="1080" y="31" width="156" height="32" rx="10" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="1158" y="51" text-anchor="middle" class="badge-text">3 Hard Exit Gates</text>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 1: ROLE 1 + DEDUPLICATION POOL      -->
  <!-- ========================================== -->
  <g id="col1-planner-and-pool">
    <!-- Role 1: Query Planner -->
    <rect x="24" y="100" width="364" height="202" rx="16" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />
    <rect x="42" y="114" width="328" height="32" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="206" y="135" text-anchor="middle" class="node-heading">Role 1: query_planner_agent</text>
    <text x="206" y="164" text-anchor="middle" class="sub-text">Output: Agent[ResearchPlan] (CoT rationale first)</text>

    <rect x="42" y="176" width="328" height="32" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="206" y="196" text-anchor="middle" class="prop-text">1. rationale: str (decomposition reasoning)</text>

    <rect x="42" y="216" width="328" height="32" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="206" y="236" text-anchor="middle" class="prop-text">2. subqueries: list[str] (1..3 queries)</text>

    <rect x="42" y="256" width="328" height="32" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="206" y="276" text-anchor="middle" class="prop-text">3. target_topics: list[str] (1..5 slugs)</text>

    <!-- Multi-Hop Deduplication Pool -->
    <rect x="24" y="330" width="364" height="206" rx="16" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
    <rect x="42" y="344" width="328" height="32" rx="8" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="206" y="365" text-anchor="middle" class="node-heading">merge_hop_candidates (3-Way RRF)</text>
    <text x="206" y="394" text-anchor="middle" class="sub-text">BM25 + pgvector + Memgraph :Topic -&gt; :Claim</text>

    <rect x="42" y="406" width="328" height="34" rx="8" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.5" />
    <text x="206" y="427" text-anchor="middle" class="prop-text">Keyed by passage_id (keeps max rrf_score)</text>

    <rect x="42" y="448" width="328" height="34" rx="8" fill="#FFFFFF" stroke="#43C37E" stroke-width="1.5" />
    <text x="206" y="469" text-anchor="middle" class="prop-text">Enriches claim_id, claim_text, claim_type</text>

    <rect x="42" y="490" width="328" height="32" rx="8" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="206" y="510" text-anchor="middle" class="badge-text">Returns (merged_pool, newly_added)</text>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 2: 3 HARD GUARDRAILS + ROLE 2       -->
  <!-- ========================================== -->
  <g id="col2-guardrails-and-critic">
    <!-- 3 Hard Stopping Guardrails -->
    <rect x="448" y="100" width="384" height="202" rx="16" fill="#FFFDF5" stroke="#EEC15E" stroke-width="2" />
    <rect x="466" y="114" width="348" height="32" rx="8" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="640" y="135" text-anchor="middle" class="node-heading">3 Hard Guardrails (Pure Python · $0)</text>
    <text x="640" y="164" text-anchor="middle" class="sub-text">Checked before spending tokens on another hop</text>

    <rect x="466" y="176" width="348" height="32" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="640" y="196" text-anchor="middle" class="prop-text">Gate 1: iteration &gt;= max_iterations (3 hops)</text>

    <rect x="466" y="216" width="348" height="32" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="640" y="236" text-anchor="middle" class="prop-text">Gate 2: accumulated_usd &gt;= max_usd ($0.25)</text>

    <rect x="466" y="256" width="348" height="32" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="640" y="276" text-anchor="middle" class="prop-text">Gate 3: newly_added == 0 (zero new passages)</text>

    <!-- Role 2: Coverage Critic -->
    <rect x="448" y="330" width="384" height="206" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <rect x="466" y="344" width="348" height="32" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="640" y="365" text-anchor="middle" class="node-heading">Role 2: coverage_critic_agent</text>
    <text x="640" y="394" text-anchor="middle" class="sub-text">Output: Agent[CoverageReflection] (if gates pass)</text>

    <rect x="466" y="406" width="348" height="30" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="640" y="425" text-anchor="middle" class="prop-text">1. rationale: str + missing_aspects: list[str]</text>

    <rect x="466" y="444" width="348" height="30" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="640" y="463" text-anchor="middle" class="prop-text">2. is_sufficient: bool (stop if True)</text>

    <rect x="466" y="482" width="348" height="38" rx="8" fill="#DFF4FF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="640" y="500" text-anchor="middle" class="prop-text">3. followup_queries: list[str] (0..2 novel)</text>
    <text x="640" y="514" text-anchor="middle" class="sub-text">strips any query already in executed_queries</text>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 3: ROLE 3 (SYNTHESIZER) + EVAL GATE -->
  <!-- ========================================== -->
  <g id="col3-synthesizer">
    <!-- Role 3: Research Synthesizer -->
    <rect x="892" y="100" width="364" height="260" rx="16" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />
    <rect x="910" y="114" width="328" height="32" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1074" y="135" text-anchor="middle" class="node-heading">Role 3: research_synthesizer</text>
    <text x="1074" y="164" text-anchor="middle" class="sub-text">Synthesizes top deduplicated evidence [1]..[M]</text>

    <rect x="910" y="178" width="328" height="44" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1074" y="197" text-anchor="middle" class="prop-text">Strict [k] inline citation attribution</text>
    <text x="1074" y="213" text-anchor="middle" class="sub-text">Maps every claim to passage_id &amp; article_url</text>

    <rect x="910" y="232" width="328" height="44" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1074" y="251" text-anchor="middle" class="prop-text">Epistemic claim_type calibration</text>
    <text x="1074" y="267" text-anchor="middle" class="sub-text">measurement vs. opinion vs. prediction</text>

    <rect x="910" y="286" width="328" height="54" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1074" y="307" text-anchor="middle" class="prop-text">Cross-Publication Disagreements</text>
    <text x="1074" y="325" text-anchor="middle" class="sub-text">Contrasts conflicting author viewpoints</text>

    <!-- Week 5 Self-Eval Gate -->
    <rect x="892" y="384" width="364" height="152" rx="16" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />
    <rect x="910" y="398" width="328" height="32" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="1074" y="419" text-anchor="middle" class="node-heading">Week 5 Self-Evaluation Gate</text>

    <rect x="910" y="440" width="328" height="36" rx="8" fill="#FFFFFF" stroke="#D9468F" stroke-width="1.5" />
    <text x="1074" y="462" text-anchor="middle" class="prop-text">Level 1: FM-1..FM-3 (Python &lt;1ms · $0)</text>

    <rect x="910" y="484" width="328" height="36" rx="8" fill="#FFFFFF" stroke="#D9468F" stroke-width="1.5" />
    <text x="1074" y="506" text-anchor="middle" class="prop-text">Level 2: FM-4 &amp; FM-5 Binary Judges</text>
  </g>

  <!-- ========================================== -->
  <!-- CONNECTORS & ARROWS                        -->
  <!-- ========================================== -->
  <g id="connectors">
    <!-- Role 1 -> Deduplication Pool -->
    <path d="M 206 302 L 206 324" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Deduplication Pool -> 3 Hard Guardrails -->
    <path d="M 388 420 L 418 420 L 418 201 L 442 201" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- 3 Hard Guardrails -> Role 2 (Continue if within bounds) -->
    <path d="M 640 302 L 640 324" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Role 2 -> Deduplication Pool (followup_queries loop) -->
    <path d="M 448 501 L 394 501" fill="none" stroke="#4A3F28" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-dotted)" />

    <!-- 3 Hard Guardrails -> Role 3 (Exit on cap / convergence) -->
    <path d="M 832 201 L 886 201" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Role 2 -> Role 3 (Exit when is_sufficient == True) -->
    <path d="M 832 459 L 862 459 L 862 255 L 886 255" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Role 3 -> Week 5 Self-Eval Gate -->
    <path d="M 1074 360 L 1074 378" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />
  </g>
</svg>

