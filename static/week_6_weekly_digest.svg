<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="100%" height="100%">
  <defs>
    <style>
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #2C3560;
      }
      .node-heading {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 14.5px;
        fill: #2C3560;
      }
      .prop-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 600;
        font-size: 11.5px;
        fill: #2C3560;
      }
      .sub-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        fill: #52587A;
      }
      .badge-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-weight: 700;
        font-size: 11px;
        fill: #2C3560;
      }
    </style>

    <marker id="arrow-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2C3560" />
    </marker>
    <marker id="arrow-dotted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4A3F28" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="540" rx="18" fill="#FFFFFF" />

  <!-- ========================================== -->
  <!-- TOP HEADER BANNER                          -->
  <!-- ========================================== -->
  <g id="header">
    <rect x="24" y="18" width="1232" height="58" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <text x="52" y="54" class="title-text">Automated Weekly Digest Workflow</text>

    <rect x="656" y="31" width="184" height="32" rx="10" fill="#DFF4FF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="748" y="51" text-anchor="middle" class="badge-text">Cron (0 8 * * 1) + Event</text>

    <rect x="852" y="31" width="194" height="32" rx="10" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="949" y="51" text-anchor="middle" class="badge-text">Cross-Pub :Topic Hubs</text>

    <rect x="1058" y="31" width="178" height="32" rx="10" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1147" y="51" text-anchor="middle" class="badge-text">UUIDv5 Idempotent Key</text>
  </g>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: DUAL TRIGGERS + INPUT CORPUS  -->
  <!-- ========================================== -->
  <g id="left-triggers">
    <!-- Dual Triggers Card -->
    <rect x="24" y="100" width="260" height="200" rx="16" fill="#DFF4FF" stroke="#59ADD9" stroke-width="2" />
    <text x="154" y="128" text-anchor="middle" class="node-heading">Dual Triggers</text>
    <text x="154" y="148" text-anchor="middle" class="sub-text">Scheduled cron or on-demand API</text>

    <rect x="42" y="164" width="224" height="52" rx="8" fill="#A6EAFE" stroke="#59ADD9" stroke-width="1.5" />
    <text x="154" y="185" text-anchor="middle" class="prop-text">TriggerCron("0 8 * * 1")</text>
    <text x="154" y="203" text-anchor="middle" class="sub-text">Every Monday at 08:00 UTC</text>

    <rect x="42" y="228" width="224" height="54" rx="8" fill="#FFFFFF" stroke="#59ADD9" stroke-width="1.5" />
    <text x="154" y="249" text-anchor="middle" class="prop-text">POST /digests/run (&lt;50ms)</text>
    <text x="154" y="267" text-anchor="middle" class="sub-text">emits kb/digest.requested</text>

    <!-- Rolling Window Input Card -->
    <rect x="24" y="322" width="260" height="194" rx="16" fill="#E7E5ED" stroke="#3B4063" stroke-width="2" />
    <text x="154" y="350" text-anchor="middle" class="node-heading">7-Day Rolling Window</text>
    <text x="154" y="370" text-anchor="middle" class="sub-text">Postgres + Memgraph Ontology</text>

    <rect x="42" y="384" width="224" height="34" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="154" y="405" text-anchor="middle" class="prop-text">articles (published_at &gt;= T-7d)</text>

    <rect x="42" y="426" width="224" height="34" rx="8" fill="#FFFFFF" stroke="#3B4063" stroke-width="1.5" />
    <text x="154" y="447" text-anchor="middle" class="prop-text">claims (valid_to IS NULL)</text>

    <rect x="42" y="468" width="224" height="32" rx="8" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="154" y="488" text-anchor="middle" class="badge-text">Shared :Topic Hubs (&gt;=2 pubs)</text>
  </g>

  <!-- ========================================== -->
  <!-- CENTER CONTAINER: generate-weekly-digest   -->
  <!-- ========================================== -->
  <g id="center-digest-fn">
    <rect x="334" y="100" width="604" height="416" rx="18" fill="#F6FBF8" stroke="#43C37E" stroke-width="2.5" />
    <rect x="354" y="116" width="564" height="38" rx="10" fill="#CBFDE5" stroke="#43C37E" stroke-width="1.5" />
    <text x="636" y="140" text-anchor="middle" class="node-heading">generate-weekly-digest (Inngest Durable Function · retries=2)</text>

    <!-- Step 1: collect-weekly-window -->
    <rect x="354" y="172" width="564" height="72" rx="12" fill="#D8F8E4" stroke="#43C37E" stroke-width="2" />
    <text x="636" y="198" text-anchor="middle" class="prop-text">1. collect-weekly-window (collect_weekly_digest_inputs)</text>
    <text x="636" y="218" text-anchor="middle" class="sub-text">Fetches window articles, quote-verified claims [1..N], and groups cross-publication :Topic hubs</text>

    <!-- Step 2: synthesize-weekly-digest -->
    <rect x="354" y="264" width="564" height="122" rx="12" fill="#FFFDF5" stroke="#EEC15E" stroke-width="2" />
    <rect x="372" y="276" width="528" height="28" rx="6" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.5" />
    <text x="636" y="294" text-anchor="middle" class="prop-text">2. synthesize-weekly-digest (weekly_digest_agent)</text>

    <rect x="372" y="314" width="168" height="58" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="456" y="338" text-anchor="middle" class="prop-text">Key Claims</text>
    <text x="456" y="356" text-anchor="middle" class="sub-text">Measurements [k]</text>

    <rect x="552" y="314" width="168" height="58" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="636" y="338" text-anchor="middle" class="prop-text">Shared Threads</text>
    <text x="636" y="356" text-anchor="middle" class="sub-text">&amp; Disagreements</text>

    <rect x="732" y="314" width="168" height="58" rx="8" fill="#FFFFFF" stroke="#EEC15E" stroke-width="1.5" />
    <text x="816" y="338" text-anchor="middle" class="prop-text">Watchlist</text>
    <text x="816" y="356" text-anchor="middle" class="sub-text">&amp; Predictions</text>

    <!-- Step 3 & Step 4 -->
    <rect x="354" y="406" width="292" height="92" rx="12" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />
    <text x="500" y="432" text-anchor="middle" class="prop-text">3. verify-and-persist-digest</text>
    <text x="500" y="452" text-anchor="middle" class="sub-text">FM-1..FM-3 deterministic check</text>
    <rect x="372" y="462" width="256" height="24" rx="6" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.2" />
    <text x="500" y="478" text-anchor="middle" class="badge-text">UUIDv5(window_start, window_end)</text>

    <rect x="664" y="406" width="254" height="92" rx="12" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />
    <text x="791" y="432" text-anchor="middle" class="prop-text">4. emit-digest-published</text>
    <text x="791" y="452" text-anchor="middle" class="sub-text">Broadcasts completion event</text>
    <rect x="682" y="462" width="218" height="24" rx="6" fill="#FEE8B4" stroke="#EEC15E" stroke-width="1.2" />
    <text x="791" y="478" text-anchor="middle" class="badge-text">kb/digest.published</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: DIGESTS TABLE & FAST READ    -->
  <!-- ========================================== -->
  <g id="right-outputs">
    <!-- digests Table Card -->
    <rect x="992" y="100" width="264" height="224" rx="16" fill="#ECDDFF" stroke="#8A4EC0" stroke-width="2" />
    <text x="1124" y="128" text-anchor="middle" class="node-heading">Postgres: digests</text>
    <text x="1124" y="148" text-anchor="middle" class="sub-text">Sole writer: generate-weekly-digest</text>

    <rect x="1010" y="164" width="228" height="32" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1124" y="184" text-anchor="middle" class="prop-text">id: UUIDv5 (zero duplicates)</text>

    <rect x="1010" y="204" width="228" height="32" rx="8" fill="#E3C3FD" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1124" y="224" text-anchor="middle" class="prop-text">summary_md + citations JSONB</text>

    <rect x="1010" y="244" width="228" height="62" rx="8" fill="#FFFFFF" stroke="#8A4EC0" stroke-width="1.5" />
    <text x="1124" y="266" text-anchor="middle" class="prop-text">stats JSONB</text>
    <text x="1124" y="284" text-anchor="middle" class="sub-text">articles_count · claims_count</text>
    <text x="1124" y="298" text-anchor="middle" class="sub-text">shared_topics · deterministic_passed</text>

    <!-- Fast Read Card -->
    <rect x="992" y="346" width="264" height="170" rx="16" fill="#FCE7F3" stroke="#D9468F" stroke-width="2" />
    <text x="1124" y="374" text-anchor="middle" class="node-heading">Fast Read (&lt;1s)</text>
    <text x="1124" y="394" text-anchor="middle" class="sub-text">Direct Postgres read path</text>

    <rect x="1010" y="410" width="228" height="38" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="1124" y="434" text-anchor="middle" class="prop-text">GET /digests/latest</text>

    <rect x="1010" y="458" width="228" height="38" rx="8" fill="#FBCFE8" stroke="#D9468F" stroke-width="1.5" />
    <text x="1124" y="482" text-anchor="middle" class="prop-text">MCP: kb_weekly_digest()</text>
  </g>

  <!-- ========================================== -->
  <!-- CONNECTORS & ARROWS                        -->
  <!-- ========================================== -->
  <g id="connectors">
    <!-- Dual Triggers -> Inngest Function -->
    <path d="M 284 200 L 328 200" fill="none" stroke="#4A3F28" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-dotted)" />

    <!-- Rolling Window -> Step 1 -->
    <path d="M 284 405 L 310 405 L 310 215 L 348 215" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 1 -> Step 2 -->
    <path d="M 636 244 L 636 258" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 2 -> Step 3 -->
    <path d="M 500 386 L 500 400" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 3 -> Step 4 -->
    <path d="M 646 452 L 658 452" fill="none" stroke="#2C3560" stroke-width="2" marker-end="url(#arrow-navy)" />

    <!-- Step 3 -> Postgres digests -->
    <path d="M 938 220 L 986 220" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />

    <!-- Postgres digests -> Fast Read -->
    <path d="M 1124 324 L 1124 340" fill="none" stroke="#2C3560" stroke-width="2.2" marker-end="url(#arrow-navy)" />
  </g>
</svg>

